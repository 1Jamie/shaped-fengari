name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (optional, defaults to vX.X.X from package.json)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Build distribution bundles
        run: npm run build

      - name: Run test suite
        run: npm test -- --maxWorkers=$(nproc)
        env:
          FENGARICONF: '{"LUAI_MAXSTACK":100000}'

      - name: Package standalone distribution archives
        run: |
          tar -czvf shaped-fengari-dist.tar.gz -C dist .
          zip -r shaped-fengari-dist.zip dist/

      - name: Determine tag name
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/shaped-fengari.js
            dist/shaped-fengari.js.map
            dist/shaped-fengari.min.js
            dist/shaped-fengari.min.js.map
            dist/shaped-fengari.mjs
            dist/shaped-fengari.mjs.map
            dist/shaped-fengari.min.mjs
            dist/shaped-fengari.min.mjs.map
            dist/shaped-fengari.esm.js
            dist/shaped-fengari.esm.js.map
            dist/shaped-fengari.esm.min.js
            dist/shaped-fengari.esm.min.js.map
            dist/shaped-fengari.cjs
            dist/shaped-fengari.cjs.map
            dist/fengari.js
            dist/fengari.min.js
            shaped-fengari-dist.tar.gz
            shaped-fengari-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
