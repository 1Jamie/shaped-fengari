name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (optional, defaults to vX.X.X from package.json)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Build distribution bundles
        run: npm run build

      - name: Run test suite
        run: npm test -- --maxWorkers=$(nproc)
        env:
          FENGARICONF: '{"LUAI_MAXSTACK":100000}'

      - name: Determine tag name
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Package distribution archives
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          PACKAGE_NAME="shaped-fengari-${TAG}"
          rm -rf pkg "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}.zip"
          mkdir -p "pkg/${PACKAGE_NAME}"
          cp -r dist "pkg/${PACKAGE_NAME}/"
          cp README.md LICENSE package.json "pkg/${PACKAGE_NAME}/"
          tar -czvf "${PACKAGE_NAME}.tar.gz" -C pkg "${PACKAGE_NAME}"
          (cd pkg && zip -r "../${PACKAGE_NAME}.zip" "${PACKAGE_NAME}")
          rm -rf pkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/shaped-fengari.min.js
            shaped-fengari-*.tar.gz
            shaped-fengari-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
